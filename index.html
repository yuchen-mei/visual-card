    function renderPerformanceList() {
      const list = $("performanceList");
      const items = state.data.performance.items;
      const shown = shownPerformance();
      list.innerHTML = "";

      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = `perf-row ${index === shown ? "active" : ""}`.trim();
        row.dataset.index = String(index);
        row.tabIndex = 0;
        const gainShare = item.currentValue ? Math.abs(item.gain) / Math.abs(item.currentValue) * 100 : 0;
        const pct = item.gain === 0 ? 0 : Math.max(4, Math.min(100, gainShare));
        row.innerHTML = `
          <div class="perf-row-top">
            <div class="perf-name">${escapeHtml(item.label)}</div>
            <div class="gain ${item.gain < 0 ? "negative" : ""}">${formatSignedCurrency(item.gain)}</div>
          </div>
          <div class="perf-row-bottom">
            <span>${item.sharedPrincipal ? "共享本金" : "本金"} ${formatCurrency(item.principal)}</span>
            <span>${formatPerformanceCurrent(item)}</span>
          </div>
          <div class="bar-track"><div class="bar-fill ${item.gain < 0 ? "negative" : ""}" style="width:${pct}%"></div></div>
        `;

        bindPreview(row, "performance", index);
        bindActivate(row, () => selectPerformance(index));

        list.appendChild(row);
      });
    }

    function formatChartDate(date) {
      if (!date) return "";
      const parts = date.split("-");
      if (parts.length < 3) return date;
      return `${parts[0]}/${parts[1]}/${parts[2]}`;
    }

    function formatChartTime(time) {
      if (!Number.isFinite(time)) return "";
      const date = new Date(time);
      if (Number.isNaN(date.getTime())) return "";
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}/${month}/${day}`;
    }

    function currentTradingItem() {
      return state.data.trading.find((item) => item.ticker === state.selectedTradingTicker) || state.data.trading[0];
    }

    function nearestPrice(prices, time) {
      return prices.reduce((best, price) => {
        if (!best) return price;
        return Math.abs(price.time - time) < Math.abs(best.time - time) ? price : best;
      }, null);
    }

    // 横坐标范围必须同时覆盖价格序列与全部交易记录，
    // 否则价格数据之外（例如最新买入）的标记会被画到绘图区外而看不见。
    function tradeTimeSpan(item) {
      const times = item.prices.map((price) => price.time);
      item.orders.forEach((order) => {
        if (Number.isFinite(order.time)) times.push(order.time);
      });
      return { min: Math.min(...times), max: Math.max(...times) };
    }

    function tradeMarkerClose(prices, order) {
      const first = prices[0];
      const last = prices[prices.length - 1];
      if (order.time < first.time || order.time > last.time) {
        // 价格序列之外的交易没有曲线点可以吸附，直接用成交价。
        if (Number.isFinite(order.price) && order.price > 0) return order.price;
        return order.time < first.time ? first.close : last.close;
      }
      return nearestPrice(prices, order.time)?.close ?? order.price;
    }

    function scaleLinear(domainMin, domainMax, rangeMin, rangeMax) {
      const span = domainMax - domainMin || 1;
      return (value) => rangeMin + (value - domainMin) / span * (rangeMax - rangeMin);
    }

    function priceSourceLabel(source) {
      if (source === "encrypted") return "内置价格";
      if (source === "preview") return "预览价格";
      if (!source) return "价格数据";
      return "公开价格";
    }

    function renderTickerSelector() {
      const selector = $("tickerSelector");
      const scrollLeft = selector.scrollLeft;
      selector.innerHTML = "";

      state.data.trading.forEach((item) => {
        const active = item.ticker === state.selectedTradingTicker;
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = `ticker-pill ${active ? "active" : ""}`.trim();
        pill.dataset.ticker = item.ticker;
        pill.title = `${item.nameZh || item.ticker} · ${item.orders.length} 笔交易`;
        pill.setAttribute("aria-pressed", active ? "true" : "false");
        pill.innerHTML = `
          <span class="ticker">${escapeHtml(item.ticker)}</span>
          <span class="ticker-pill-return ${item.returnPct < 0 ? "negative" : ""}">${formatSignedPct(item.returnPct)}</span>
        `;

        pill.addEventListener("click", () => selectTradingTicker(item.ticker));
        selector.appendChild(pill);
      });

      selector.scrollLeft = scrollLeft;
    }

    function renderTradeList() {
      const list = $("tradeList");
      const item = currentTradingItem();
      list.innerHTML = "";
      if (!item) return;
      const shown = shownTrade();

      item.orders.forEach((order, index) => {
        const isSell = order.side === "sell";
        const row = document.createElement("div");
        row.className = `trade-row ${index === shown ? "active" : ""}`.trim();
        row.dataset.index = String(index);
        row.tabIndex = 0;
        row.innerHTML = `
          <div class="trade-main">
            <span class="trade-side ${isSell ? "sell" : ""}">${isSell ? "卖出" : "买入"}</span>
            <div class="trade-meta">${formatChartDate(order.date)} · ${order.shares} 股</div>
          </div>
          <div class="trade-price">${formatCurrencyFull(order.price)}</div>
        `;

        bindPreview(row, "trade", index);
        bindActivate(row, () => selectTrade(index));
        list.appendChild(row);
      });
    }

    // 交易图按容器实际像素尺寸绘制（1 个 viewBox 单位 = 1px），手机上的文字不会被等比缩小。
    let tradeChartModel = null;
    let tradeChartSize = "";

    function renderTradeChart() {
      const item = currentTradingItem();
      const svg = $("tradeChart");
      svg.innerHTML = "";
      tradeChartModel = null;
      if (!item) return;

      const wrap = svg.parentElement;
      const measured = wrap.clientWidth > 0 && wrap.clientHeight > 0;
      const width = measured ? Math.round(wrap.clientWidth) : 860;
      const height = measured ? Math.round(wrap.clientHeight) : 430;
      tradeChartSize = measured ? `${width}x${height}` : "";
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.classList.toggle("is-down", item.returnPct < 0);

      const padding = { left: 14, right: 14, top: 20, bottom: 32 };
      const chartLeft = padding.left;
      const chartRight = width - padding.right;
      const chartTop = padding.top;
      const chartBottom = height - padding.bottom;
      const priceStart = item.prices[0].time;
      const priceEnd = item.prices[item.prices.length - 1].time;
      const span = tradeTimeSpan(item);
      const markerCloses = item.orders
        .map((order) => tradeMarkerClose(item.prices, order))
        .filter((value) => Number.isFinite(value));
      const closes = item.prices
        .map((price) => price.close)
        .filter((value) => Number.isFinite(value))
        .concat(markerCloses);
      const minClose = Math.min(...closes);
      const maxClose = Math.max(...closes);
      const pricePad = (maxClose - minClose || maxClose * 0.04 || 1) * 0.12;
      const yMin = minClose - pricePad;
      const yMax = maxClose + pricePad;
      // 若交易记录把时间轴撑到价格序列之外，两端留出标记半径的空间，避免边缘标记被裁掉。
      const markerRoom = 16;
      const rangeLeft = chartLeft + (span.min < priceStart ? markerRoom : 0);
      const rangeRight = chartRight - (span.max > priceEnd ? markerRoom : 0);
      const x = scaleLinear(span.min, span.max, rangeLeft, rangeRight);
      const y = scaleLinear(yMin, yMax, chartBottom, chartTop);
      const points = item.prices.map((price) => ({
        ...price,
        x: x(price.time),
        y: y(price.close)
      }));
      const line = points.map((point, index) => `${index ? "L" : "M"} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`).join(" ");
      const area = `${line} L ${points[points.length - 1].x.toFixed(2)} ${chartBottom} L ${points[0].x.toFixed(2)} ${chartBottom} Z`;

      // 起点价参考线：曲线在它上方即区间上涨。
      const baseY = points[0].y.toFixed(2);
      svg.appendChild(svgEl("line", {
        x1: String(chartLeft),
        x2: String(chartRight),
        y1: baseY,
        y2: baseY,
        class: "baseline-line"
      }));

      const xTicks = [span.min, span.min + (span.max - span.min) / 2, span.max];
      xTicks.forEach((time, index) => {
        const label = svgEl("text", {
          x: x(time).toFixed(2),
          y: String(height - 10),
          "text-anchor": index === 0 ? "start" : index === 2 ? "end" : "middle",
          class: "axis-label"
        });
        label.textContent = formatChartTime(time);
        svg.appendChild(label);
      });

      svg.appendChild(svgEl("path", { d: area, class: "price-area" }));
      svg.appendChild(svgEl("path", { d: line, class: "price-path" }));

      const scrub = svgEl("g", { display: "none" });
      const scrubLine = svgEl("line", {
        x1: "0",
        x2: "0",
        y1: String(chartTop),
        y2: String(chartBottom),
        class: "scrub-line"
      });
      const scrubDot = svgEl("circle", { cx: "0", cy: "0", r: "5", class: "scrub-dot" });
      scrub.append(scrubLine, scrubDot);
      svg.appendChild(scrub);

      const markerLayer = svgEl("g");
      const shown = shownTrade();
      const hasTradeSelection = shown >= 0 && shown < item.orders.length;
      item.orders.forEach((order, index) => {
        const markerX = x(order.time);
        const markerY = y(tradeMarkerClose(item.prices, order));
        const isSell = order.side === "sell";
        const active = index === shown;
        const marker = svgEl("g", {
          class: `trade-marker ${isSell ? "sell" : "buy"} ${active ? "active" : hasTradeSelection ? "dim" : ""}`.trim(),
          transform: `translate(${markerX.toFixed(2)} ${markerY.toFixed(2)})`,
          tabindex: "0",
          "aria-label": `${isSell ? "卖出" : "买入"} ${formatChartDate(order.date)} ${formatCurrencyFull(order.price)}`
        });
        marker.dataset.index = String(index);
        marker.dataset.x = markerX.toFixed(2);
        marker.dataset.y = markerY.toFixed(2);

        // 透明命中区 24px，比可见标记大，方便点中。
        marker.appendChild(svgEl("circle", { cx: "0", cy: "0", r: "12", class: "marker-hit" }));
        const dot = svgEl("g", { class: "marker-dot" });
        dot.appendChild(svgEl("circle", { cx: "0", cy: "0", r: "9", class: "marker-circle" }));
        const label = svgEl("text", {
          x: "0",
          y: "3.5",
          "text-anchor": "middle",
          class: "marker-label"
        });
        label.textContent = isSell ? "S" : "B";
        dot.appendChild(label);
        marker.appendChild(dot);

        bindPreview(marker, "trade", index);
        bindActivate(marker, () => selectTrade(index));
        markerLayer.appendChild(marker);
      });
      svg.appendChild(markerLayer);

      const callout = svgEl("g", { id: "tradeCallout", display: "none" });
      callout.appendChild(svgEl("rect", {
        id: "tradeCalloutBox",
        x: "0",
        y: "0",
        width: "168",
        height: "50",
        rx: "10",
        class: "chart-callout"
      }));
      callout.appendChild(svgEl("text", {
        id: "tradeCalloutTitle",
        x: "12",
        y: "20",
        class: "chart-callout-text"
      }));
      callout.appendChild(svgEl("text", {
        id: "tradeCalloutSub",
        x: "12",
        y: "38",
        class: "chart-callout-text"
      }));
      svg.appendChild(callout);

      tradeChartModel = { item, points, width, chartBottom, scrub, scrubLine, scrubDot, index: -1 };
    }

    // 标题处的价格读数：默认显示最新收盘价和区间涨跌，拖动曲线时显示对应日期的价格。
    function setTradeReadout(item, point, animate = false) {
      const prices = item.prices;
      const first = prices[0];
      const last = prices[prices.length - 1];
      const shown = point || last;
      const change = first.close ? (shown.close - first.close) / first.close * 100 : 0;
      const price = $("tradeReadoutPrice");
      if (animate) tweenText(price, shown.close, formatCurrencyFull);
      else setTextNow(price, shown.close, formatCurrencyFull);
      $("tradeReadoutDelta").classList.toggle("negative", change < 0);
      setText("tradeReadoutChange", formatSignedPct(change));
      setText("tradeReadoutDate", point ? formatChartDate(point.date) : `截至 ${formatChartDate(last.date)}`);
    }

    function nearestPointIndex(points, x) {
      let lo = 0;
      let hi = points.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (points[mid].x < x) lo = mid + 1;
        else hi = mid;
      }
      if (lo > 0 && Math.abs(points[lo - 1].x - x) <= Math.abs(points[lo].x - x)) return lo - 1;
      return lo;
    }

    function scrubTo(index) {
      const model = tradeChartModel;
      if (!model || !model.points.length) return;
      const i = Math.max(0, Math.min(model.points.length - 1, index));
      const point = model.points[i];
      model.index = i;
      model.scrub.removeAttribute("display");
      model.scrubLine.setAttribute("x1", point.x.toFixed(2));
      model.scrubLine.setAttribute("x2", point.x.toFixed(2));
      model.scrubDot.setAttribute("cx", point.x.toFixed(2));
      model.scrubDot.setAttribute("cy", point.y.toFixed(2));
      setTradeReadout(model.item, point);
    }

    function endScrub() {
      const model = tradeChartModel;
      if (!model || model.index < 0) return;
      model.index = -1;
      model.scrub.setAttribute("display", "none");
      setTradeReadout(model.item, null);
    }

    // 拖动查看只更新十字线和读数的几个属性，每帧最多一次，不重绘整张图。
    function bindTradeChartScrub() {
      const svg = $("tradeChart");
      let frame = 0;
      let pending = null;

      const scrubAtPointer = (event) => {
        if (!tradeChartModel) return;
        pending = { x: event.clientX, y: event.clientY };
        if (frame) return;
        frame = window.requestAnimationFrame(() => {
          frame = 0;
          const matrix = svg.getScreenCTM();
          if (!matrix || !pending || !tradeChartModel) return;
          const point = new DOMPoint(pending.x, pending.y).matrixTransform(matrix.inverse());
          scrubTo(nearestPointIndex(tradeChartModel.points, point.x));
        });
      };

      const stop = () => {
        pending = null;
        if (frame) {
          window.cancelAnimationFrame(frame);
          frame = 0;
        }
        endScrub();
      };

      svg.addEventListener("pointermove", scrubAtPointer);
      svg.addEventListener("pointerdown", scrubAtPointer);
      svg.addEventListener("pointerleave", stop);
      svg.addEventListener("pointercancel", stop);
      svg.addEventListener("pointerup", (event) => {
        if (event.pointerType !== "mouse") stop();
      });
      svg.addEventListener("keydown", (event) => {
        if (event.target !== svg || !tradeChartModel) return;
        const count = tradeChartModel.points.length;
        const current = tradeChartModel.index < 0 ? count - 1 : tradeChartModel.index;
        const step = event.shiftKey ? 10 : 1;
        const moves = { ArrowLeft: current - step, ArrowRight: current + step, Home: 0, End: count - 1 };
        if (Object.prototype.hasOwnProperty.call(moves, event.key)) {
          event.preventDefault();
          scrubTo(moves[event.key]);
        } else if (event.key === "Escape") {
          endScrub();
        }
      });
      svg.addEventListener("blur", endScrub);
    }

    // 容器尺寸变化（窗口缩放、切到交易页）时按新尺寸重绘；尺寸未变则跳过。
    function watchTradeChartSize() {
      if (!("ResizeObserver" in window)) return;
      const wrap = $("tradeChart").parentElement;
      let frame = 0;
      const observer = new ResizeObserver(() => {
        window.cancelAnimationFrame(frame);
        frame = window.requestAnimationFrame(() => {
          if (!state.data?.trading?.length) return;
          if (!wrap.clientWidth || !wrap.clientHeight) return;
          const size = `${Math.round(wrap.clientWidth)}x${Math.round(wrap.clientHeight)}`;
          if (size === tradeChartSize) return;
          renderTradeChart();
          updateTradeSelection();
          const item = currentTradingItem();
          if (item) setTradeReadout(item, null);
        });
      });
      observer.observe(wrap);
    }

    function renderTradeSummary() {
      const item = currentTradingItem();
      if (!item) return;
      const span = tradeTimeSpan(item);
      const buys = item.orders.filter((order) => order.side === "buy").length;
      const sells = item.orders.filter((order) => order.side === "sell").length;

      $("tradeChartTitle").textContent = item.ticker;
      $("tradeChartName").textContent = [item.nameZh, `${item.orders.length} 笔交易`].filter(Boolean).join(" · ");
      $("tradeChartRange").textContent = `${formatChartTime(span.min)} - ${formatChartTime(span.max)} · ${priceSourceLabel(item.priceSource)}`;
      $("tradeReturn").textContent = formatSignedPct(item.returnPct);
      $("tradeReturn").className = `summary-value gain ${item.returnPct < 0 ? "negative" : ""}`;
      $("tradeBuyCount").textContent = `${buys} 次`;
      $("tradeSellCount").textContent = `${sells} 次`;
      setTradeReadout(item, null, true);
    }

    function renderTradingEmpty() {
      tradeChartModel = null;
      window.cancelAnimationFrame($("tradeReadoutPrice")._tweenFrame);
      $("tradeChartTitle").textContent = "交易轨迹";
      $("tradeChartName").textContent = "";
      $("tradeChartRange").textContent = "";
      $("tradeReadoutPrice").textContent = "";
      $("tradeReadoutChange").textContent = "";
      $("tradeReadoutDate").textContent = "";
      $("tradeChart").innerHTML = "";
      $("tradeReturn").textContent = "–";
      $("tradeReturn").className = "summary-value";
      $("tradeBuyCount").textContent = "–";
      $("tradeSellCount").textContent = "–";
      $("tickerSelector").innerHTML = '<div class="empty-note">当前数据中没有可生成交易预览的股票持仓。</div>';
      $("tradeList").innerHTML = "";
      $("tradeDetail").innerHTML = "";
      $("tradeDetail").hidden = true;
    }

    function renderTrading() {
      dropPreview("trade");
      if (!state.data.trading.length) {
        renderTradingEmpty();
        return;
      }
      if (!state.selectedTradingTicker) state.selectedTradingTicker = state.data.trading[0].ticker;
      renderTradeSummary();
      renderTickerSelector();
      renderTradeList();
      renderTradeChart();
      updateTradeSelection();
    }

    function updateTradeSelection() {
      const item = currentTradingItem();
      if (!item) return;
      const index = shownTrade();
      const hasSelection = index >= 0 && index < item.orders.length;
      const detail = $("tradeDetail");
      const svg = $("tradeChart");
      const callout = $("tradeCallout");

      updateRowSelection("tradeList", ".trade-row", hasSelection ? index : -1);
      if (!hasSelection) {
        detail.innerHTML = "";
        detail.hidden = true;
        svg?.querySelectorAll(".trade-marker").forEach((marker) => {
          marker.classList.remove("active", "dim");
        });
        callout?.setAttribute("display", "none");
        return;
      }

      const order = item.orders[index];
      const isSell = order.side === "sell";
      detail.hidden = false;
      detail.innerHTML = `
        <div class="trade-detail-head">
          <div class="trade-detail-title">${escapeHtml(item.ticker)} ${isSell ? "卖出" : "买入"}</div>
          <div class="trade-detail-side ${isSell ? "sell" : ""}">${formatCurrencyFull(order.price)}</div>
        </div>
        <div class="trade-detail-text">${formatChartDate(order.date)} · ${order.shares} 股 · ${isSell ? "降低仓位" : "增加仓位"}</div>
      `;

      svg.querySelectorAll(".trade-marker").forEach((marker) => {
        const active = Number(marker.dataset.index) === index;
        marker.classList.toggle("active", active);
        marker.classList.toggle("dim", !active);
      });

      const marker = svg.querySelector(`.trade-marker[data-index="${index}"]`);
      if (!marker || !callout || !tradeChartModel) return;

      setSvgText("tradeCalloutTitle", `${isSell ? "卖出" : "买入"} ${order.shares} 股`);
      setSvgText("tradeCalloutSub", `${formatChartDate(order.date)} · ${formatCurrencyFull(order.price)}`);
      callout.removeAttribute("display");

      // 气泡宽度按文字实际宽度计算；标记太靠右时翻到左侧，太靠上时放到下方。
      const textWidth = Math.max(
        $("tradeCalloutTitle").getComputedTextLength?.() || 0,
        $("tradeCalloutSub").getComputedTextLength?.() || 0
      );
      const boxWidth = textWidth ? Math.max(120, Math.ceil(textWidth) + 24) : 168;
      const boxHeight = 50;
      $("tradeCalloutBox").setAttribute("width", String(boxWidth));

      const { width, chartBottom } = tradeChartModel;
      const markerX = Number(marker.dataset.x);
      const markerY = Number(marker.dataset.y);
      let calloutX = markerX + 16;
      if (calloutX + boxWidth > width - 8) calloutX = markerX - 16 - boxWidth;
      calloutX = Math.max(8, Math.min(width - boxWidth - 8, calloutX));
      let calloutY = markerY - boxHeight - 14;
      if (calloutY < 8) calloutY = markerY + 14;
      calloutY = Math.min(calloutY, chartBottom - boxHeight);
      callout.setAttribute("transform", `translate(${calloutX.toFixed(2)} ${calloutY.toFixed(2)})`);
    }

    function selectTradingTicker(ticker) {
      if (state.selectedTradingTicker === ticker) return;
      state.selectedTradingTicker = ticker;
      state.selectedTrade = -1;
      dropPreview("trade");
      renderTrading();
    }

    function selectTrade(index) {
      dropPreview("trade");
      // 再次点击已固定的交易会取消固定。
      state.selectedTrade = state.selectedTrade === index ? -1 : index;
      updateTradeSelection();
    }

    function numericOrNull(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function holdingGain(item) {
      const explicitGain = numericOrNull(item.unrealizedGain);
      if (explicitGain !== null) return explicitGain;

      const value = numericOrNull(item.value);
      const costBasis = numericOrNull(item.costBasis);
      if (value === null || costBasis === null) return null;

      return value - costBasis;
    }

    function holdingReturnPct(item, gain) {
      const explicitPct = numericOrNull(item.unrealizedReturnPct);
      if (explicitPct !== null) return explicitPct;

      const costBasis = numericOrNull(item.costBasis);
      if (!costBasis) return null;

      return gain / costBasis * 100;
    }

    function renderRanking() {
      const list = $("rankList");
      const ranked = [...state.data.holdings]
        .map((item) => {
          const gain = holdingGain(item);
          const returnPct = gain === null ? null : holdingReturnPct(item, gain);
          return { ...item, computedGain: gain, computedReturnPct: returnPct };
        })
        .filter((item) => item.computedGain !== null)
        .sort((a, b) => b.computedGain - a.computedGain);

      list.innerHTML = "";

      if (!ranked.length) {
        const empty = document.createElement("div");
        empty.className = "rank-row";
        empty.innerHTML = `
          <div class="rank-main">
            <div class="rank-title">暂无浮盈明细</div>
            <div class="rank-sub">缺少成本基础数据时不会显示该模块</div>
          </div>
        `;
        list.appendChild(empty);
        return;
      }

      ranked.forEach((item) => {
        const row = document.createElement("div");
        row.className = "rank-row";
        row.innerHTML = `
          <div class="rank-main">
            <div class="rank-title">${escapeHtml(item.ticker)} ${escapeHtml(item.nameZh || "")}</div>
            <div class="rank-sub">成本 ${formatCurrency(item.costBasis)} · 当前 ${formatCurrency(item.value)}</div>
          </div>
          <div class="rank-gain">
            <div class="gain ${item.computedGain < 0 ? "negative" : ""}">${formatSignedCurrency(item.computedGain)}</div>
            <div class="val">${item.computedReturnPct === null ? "–" : formatSignedPct(item.computedReturnPct)}</div>
          </div>
        `;

        list.appendChild(row);
      });
    }

    function renderSummary() {
      const data = state.data;
      const holdings = data.holdings;
      const largest = holdings[0];
      const perf = data.performance;

      $("meta").textContent = `${data.asOf || "latest"} · ${data.currency || "USD"} · CD + 股票 / ETF`;
      $("largestHolding").textContent = `${largest.ticker} ${formatPct(largest.weight)}`;
      $("holdingCount").textContent = `${holdings.length} 个`;

      $("totalGain").textContent = formatSignedCurrency(perf.totalGain);
      $("totalGain").className = `metric-value gain ${perf.totalGain < 0 ? "negative" : ""}`;
      $("totalGainSub").textContent = `本金 ${formatCurrency(perf.totalPrincipal)}，当前 ${formatCurrency(perf.totalCurrentValue)}`;
      $("totalReturn").textContent = formatSignedPct(perf.totalReturnPct);
      $("totalReturn").className = `metric-value gain ${perf.totalReturnPct < 0 ? "negative" : ""}`;
      $("totalCurrent").textContent = formatCurrency(perf.totalCurrentValue);
      $("totalPrincipal").textContent = formatCurrency(perf.totalPrincipal);
      $("gainSourceCount").textContent = `${perf.items.length} 类`;
      $("perfDate").textContent = data.asOf || "latest";
      renderHero(data, perf);
    }

    function renderHero(data, perf) {
      const current = finiteOrNull(perf.totalCurrentValue) ?? data.equityValue;
      $("heroValue").textContent = formatCurrency(current);
      const gain = finiteOrNull(perf.totalGain);
      const pct = finiteOrNull(perf.totalReturnPct);
      const delta = $("heroDelta");
      delta.hidden = gain === null;
      delta.classList.toggle("negative", gain !== null && gain < 0);
      setText("heroDeltaValue", gain === null ? "" : `${formatSignedCurrency(gain)}${pct === null ? "" : ` (${formatSignedPct(pct)})`}`);
    }

    function switchTab(tab) {
      state.activeTab = tab;
      $("tabs").dataset.active = tab;
      const tabIds = {
        holdings: "holdingsTab",
        performance: "performanceTab",
        trading: "tradingTab"
      };
      const panelIds = {
        holdings: "holdingsPanel",
        performance: "performancePanel",
        trading: "tradingPanel"
      };

      Object.entries(tabIds).forEach(([key, id]) => {
        const active = key === tab;
        $(id).classList.toggle("active", active);
        $(id).setAttribute("aria-selected", active ? "true" : "false");
      });

      const activePanel = $(panelIds[tab]);
      const inactivePanels = Object.entries(panelIds)
        .filter(([key]) => key !== tab)
        .map(([, id]) => $(id));
      if (activePanel.classList.contains("active") && activePanel.classList.contains("panel-ready") && inactivePanels.every((panel) => !panel.classList.contains("active"))) {
        return;
      }

      inactivePanels.forEach((panel) => panel.classList.remove("panel-ready", "active"));
      activePanel.classList.add("active");
      activePanel.classList.remove("panel-ready");
      window.requestAnimationFrame(() => activePanel.classList.add("panel-ready"));
    }

    function render() {
      renderSummary();
      renderHoldingsChart();
      renderHoldingList();
      renderGainChart();
      renderPerformanceList();
      renderRanking();
      renderTrading();
      updateHoldingSelection(false);
      updatePerformanceSelection(false);
      switchTab(state.activeTab);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    $("unlockBtn").addEventListener("click", unlock);
    $("refreshBtn").addEventListener("click", refreshData);
    $("lockBtn").addEventListener("click", lockPage);

    $("holdingsTab").addEventListener("click", () => switchTab("holdings"));
    $("performanceTab").addEventListener("click", () => switchTab("performance"));
    $("tradingTab").addEventListener("click", () => switchTab("trading"));

    $("passwordInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") unlock();
    });

    bindTradeChartScrub();
    watchTradeChartSize();
    prefetchData();

    window.addEventListener("load", () => {
      if (PREVIEW_MODE && EMBEDDED_DATA) {
        activateData(EMBEDDED_DATA, marketResult);
        showToast("预览模式");
      } else {
        $("passwordInput").focus();
      }
    });
  </script>
</body>
</html>
